<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validation</title>
</head>

    <body>
        <form action="/registration">
            <label for="name">Name : </label>
            <input type="text" id="name" name="name" required>
            <br><br>

            <label for="email">Email : </label>
            <input type="email" id="email" name="email" required>
            <br><br>

            <label for="roll">Roll No : </label>
            <input type="text" id="roll" name="roll" required
            pattern="[0-9]{2}[A-Za-z]{3}[0-9]{3}">
            <br><br>
            
            <label for="branch"> Branch : </label>
            <input type="text" name="branch" list="branches" required>
            <datalist id="branches">
                <option value="CSE"></option>
                <option value="DSAI"></option>
                <option value="ECE"></option>
            </datalist>
            <br>

            <h4>Year : </h4>
            <input type="radio" name="year" id="first" value="first">
            <label for="first">First</label>
            <input type="radio" name="year" id="second" value="Second">
            <label for="second">Second</label>
            <input type="radio" name="year" id="third" value="third">
            <label for="third">Third</label>
            <input type="radio" name="year" id="fourth" value="Fourth">
            <label for="fourth">Fourth</label>
            <br><br>

            <h3>Skill : </h3>
            <input type="checkbox" id="cpp" name="skill" required>
            <label for="cpp">CPP </label>
            <input type="checkbox" id="java" name="skill" required>
            <label for="java">Java </label>
            <input type="checkbox" id="javascript" name="skill" required>
            <label for="javascript">JavaScript </label>
            <br><br>

            <label for="bio"> Bio : </label><br>
            <textarea name="bio" id="bio" placeholder="Enter your bio here" rows="3" cols="40"></textarea>
        </form>
    </body>

</html>
